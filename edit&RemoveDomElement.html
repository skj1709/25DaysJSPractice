<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create new dom element</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    .parent {
      height: 100vh;
      width: 100%;
      background-color: black;
    }
    button {
      height: 25px;
      width: auto;
      padding: 5px;
      color: black;
    }
    #head,
    #para {
      color: white;
    }
  </style>
  <body>
    <div class="parent">
      <h1 id="head">Add & Remove Paragraphs</h1>
      <button onclick="addElement()">Add new Para</button>
      <button onclick="removeElement()">Remove Para</button>
    </div>
  </body>
  <script>
    const parent = document.getElementsByClassName("parent");
    function addElement() {
      const newElement = document.createElement("p");
      newElement.textContent = "This is new p created using dom";
      newElement.style.color = "white";
      parent[0].appendChild(newElement);
    }

    function removeElement() {
      const para = document.getElementsByTagName("p");
      parent[0].removeChild(para[0]);
    }
  </script>
</html>
